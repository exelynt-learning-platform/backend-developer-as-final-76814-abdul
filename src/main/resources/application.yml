server:
  port: 8080

spring:
  application:
    name: booking-system

  # ---- Default profile: H2 in-memory (zero setup, good for quick testing) ----
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # In production, load this from an environment variable / secrets manager, not source control.
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-change-me-please-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # 1 hour
  admin:
    # Bootstrap admin user auto-created on first startup if it doesn't exist.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@exelynt.com}

---
# ---- Postgres profile: run with --spring.profiles.active=postgres ----
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_system
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# ---- MySQL profile: run with --spring.profiles.active=mysql ----
# (also add mysql-connector-j dependency to pom.xml, and remove/keep postgresql driver as needed)
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/booking_system?useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
